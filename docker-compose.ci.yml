# Ajuste para el CI (se combina con docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
# En el CI NO se monta el código: se usa el que se copió a la imagen. Con el código
# montado, el usuario del runner (uid 1001) es dueño de los archivos y el contenedor
# (uid 1000) no podría escribir el cliente de Prisma ni compilar.
services:
  api:
    # Sin el código montado, pero CON el volumen de subidas (lo comparte con el worker).
    volumes: !override
      - uploads_data:/data/uploads
  web:
    volumes: !reset []
