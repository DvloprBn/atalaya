# Atalaya en DESARROLLO. Producción (v1.0) tendrá su propio docker-compose.prod.yml.
#
# Dos redes, y esa es la idea central de seguridad:
#   edge  → la que toca Caddy (caddy, web, api). Tiene salida a internet.
#   data  → interna (internal: true): base, Redis, worker. SIN salida a internet.
# El worker, que procesará archivos subidos por desconocidos, vive solo en "data":
# aunque alguien lograra ejecutar código dentro, no podría sacar datos a internet.

name: atalaya

x-hardening: &hardening
  cap_drop: [ALL]                      # ningún privilegio extra del kernel
  security_opt: [no-new-privileges:true]

services:
  caddy:
    image: caddy:2-alpine
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]        # lo único que necesita: escuchar en el puerto 80
    ports:
      - "127.0.0.1:${ATALAYA_PORT:-3070}:80"   # solo esta máquina, nunca la red local
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]
    networks: [edge]

  web:
    build: { context: ./web, dockerfile: Dockerfile.dev }
    <<: *hardening
    environment:
      API_INTERNAL_URL: http://api:3000
      NEXT_TELEMETRY_DISABLED: "1"     # Next no manda estadísticas de uso a terceros
    volumes:
      - ./web:/app
      - /app/node_modules              # los módulos del contenedor, no los del host
      - /app/.next
    depends_on: [api]
    networks: [edge]

  api:
    build: { context: ./api, dockerfile: Dockerfile.dev }
    <<: *hardening
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      # SOLO desarrollo y CI: las suites de pruebas salen de una misma IP. En producción NO se pone (vale 1).
      THROTTLE_SCALE: "5"
      # Login con Google. Por defecto apunta al servidor OAuth FALSO de abajo. Para usar Google de
      # verdad, pon los seis OAUTH_* en tu .env (ver .env.example); sin ellos, el valor de aquí manda.
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-atalaya-mock-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH_AUTH_URL: ${OAUTH_AUTH_URL:-http://localhost:3072/authorize}   # lo abre el NAVEGADOR
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-http://mock-idp:4000/token}      # lo llama el SERVIDOR, por la red interna
      OAUTH_JWKS_URL: ${OAUTH_JWKS_URL:-http://mock-idp:4000/jwks}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://mock-idp:4000}
      APP_ORIGIN: http://localhost:${ATALAYA_PORT:-3070}
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Atalaya <no-reply@example.com>
    volumes:
      - ./api:/app
      - /app/node_modules
      - uploads_data:/data/uploads        # los archivos subidos: la API escribe
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }
      mock-idp: { condition: service_started }
    networks: [edge, data]             # la única pieza que cruza de una red a otra

  worker:
    build: { context: ./worker }
    <<: *hardening
    environment:
      # Usuario de Redis PROPIO, con permiso solo para la cola y su latido (ver `redis` abajo), y rol de base
      # MÍNIMO (migración uploads_worker_role). No usa las credenciales de la API: si cae el worker, no cae todo.
      REDIS_URL: redis://worker:${WORKER_REDIS_PASSWORD:?define WORKER_REDIS_PASSWORD en .env}@redis:6379
      DATABASE_URL: postgresql://atalaya_worker:${WORKER_DB_PASSWORD:?define WORKER_DB_PASSWORD en .env}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
    read_only: true                    # no puede escribir en su propio disco
    tmpfs: [/tmp]
    volumes:
      - uploads_data:/data/uploads:ro  # lee los archivos subidos, NUNCA los modifica
    mem_limit: 512m                    # un archivo hostil no puede comerse toda la RAM
    pids_limit: 64
    cpus: 1.0
    depends_on:
      redis: { condition: service_healthy }
    networks: [data]

  # Pone LOGIN y contraseña al rol `atalaya_worker` (que la migración crea sin poder entrar) y termina.
  # Espera a que la migración exista el rol: en un arranque en limpio, corre `prisma migrate deploy` y listo.
  db-roles:
    image: postgres:18-alpine
    <<: *hardening
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?define WORKER_DB_PASSWORD en .env}
    command:
      - sh
      - -c
      - |
        until psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'atalaya_worker'" | grep -q 1; do sleep 2; done
        echo "ALTER ROLE atalaya_worker LOGIN PASSWORD :'pw'" | psql -v ON_ERROR_STOP=1 -v pw="$$WORKER_DB_PASSWORD"
    depends_on:
      db: { condition: service_healthy }
    networks: [data]

  # Servidor de correo FALSO para desarrollo: recibe todo y no entrega nada a nadie.
  # Bandeja: http://localhost:3071 (solo esta máquina). Las pruebas leen los
  # correos por su API para seguir los enlaces de verificación.
  mailpit:
    image: axllent/mailpit:v1.34.0
    <<: *hardening
    environment:
      # Sin esto los correos viven solo en memoria y desaparecen al reiniciar el contenedor
      # (y con ellos el enlace de verificación que todavía no abriste).
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-3071}:8025"
    networks: [edge]                   # una red interna no puede publicar puertos

  # SERVIDOR OAUTH FALSO (hace de Google): SOLO desarrollo y CI. El de producción (v1.0) no lo incluye.
  # Pantalla de "elegir cuenta": http://localhost:3072/authorize (solo esta máquina).
  mock-idp:
    image: node:24-alpine
    <<: *hardening
    user: node
    working_dir: /app
    command: ["node", "server.mjs"]
    read_only: true
    environment:
      PORT: "4000"
      MOCK_CLIENT_ID: ${OAUTH_CLIENT_ID:-atalaya-mock-client}
      MOCK_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      MOCK_REDIRECT_URI: http://localhost:${ATALAYA_PORT:-3070}/api/auth/google/callback
      MOCK_ISSUER: http://mock-idp:4000
    volumes:
      - ./mock-idp:/app:ro
    ports:
      - "127.0.0.1:3072:4000"
    networks: [edge]

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql    # Postgres 18 guarda sus datos bajo esta ruta
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [data]                   # sin puerto publicado: se entra con `docker compose exec db psql`

  redis:
    image: redis:8-alpine
    # `default` (la API) sigue con contraseña. El usuario `worker` solo puede: crear su grupo de la cola, leer y
    # confirmar mensajes de `atalaya:uploads`, y escribir su latido. Cualquier otro comando o llave: rechazado.
    # (La contraseña va en los argumentos: S-1 sigue abierto para v1.0, que la pasa a un archivo ACL con secretos.)
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --user
      - worker
      - "on"
      - ">${WORKER_REDIS_PASSWORD:?define WORKER_REDIS_PASSWORD en .env}"
      - "~atalaya:uploads"
      - "~atalaya:worker:*"
      - "-@all"
      - "+xgroup|create"
      - "+xreadgroup"
      - "+xack"
      - "+set"

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD} # redis-cli toma la contraseña de aquí, no de la línea de comandos
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks: [data]

networks:
  edge: {}
  data:
    internal: true

volumes:
  db_data: {}
  mailpit_data: {}
  uploads_data: {}
