[project]
name = "atalaya-worker"
version = "0.1.0"
description = "Worker de análisis de Atalaya: lee la cola de Redis y calcula informes."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.9",
    "redis>=8.1.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 130  # los comentarios en español (el porqué) son más largos
target-version = "py314"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: errores frecuentes · S: seguridad (bandit) · UP: sintaxis moderna
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # en pruebas, assert es lo que se usa y los XML de ejemplo son largos

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # el worker es una app, no un paquete instalado
