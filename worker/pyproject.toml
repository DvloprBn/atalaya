[project]
name = "atalaya-worker"
version = "0.1.0"
description = "Worker de análisis de Atalaya: lee la cola de Redis y calcula informes."
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: errores frecuentes · S: seguridad (bandit) · UP: sintaxis moderna
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # en pruebas, assert es justo lo que se usa

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # el worker es una app, no un paquete instalado
