# CI de Atalaya: cada push y cada PR pasan por aquí antes de fusionarse.
# Las acciones van fijadas por SHA de commit (no por etiqueta): una etiqueta se
# puede mover a código malicioso; un SHA no (ataque a la cadena de suministro).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # el CI solo lee el repo; no puede escribir nada

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # toda la historia: un secreto borrado sigue en commits viejos
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /repo

  api:
    name: API (NestJS)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  web:
    name: Web (Next.js)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    env: { NEXT_TELEMETRY_DISABLED: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: npm ci --no-fund
      - name: El contrato es un OpenAPI válido
        run: pip install openapi-spec-validator==0.9.0 && openapi-spec-validator ../contracts/openapi.yaml
      - name: Los tipos coinciden con el contrato
        run: npm run contract:types && git diff --exit-code src/lib/api-schema.d.ts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev

  worker:
    name: Worker (Python)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install uv==0.13.9
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run pip-audit

  e2e:
    name: Sistema completo (Docker + prueba de humo)
    needs: [api, web, worker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: .env de un solo uso con contraseñas aleatorias
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^WORKER_REDIS_PASSWORD=.*/WORKER_REDIS_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^WORKER_DB_PASSWORD=.*/WORKER_DB_PASSWORD=$(openssl rand -hex 24)/" \
              -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^TOTP_ENCRYPTION_KEY=.*/TOTP_ENCRYPTION_KEY=$(openssl rand -hex 32)/" \
              -e "s/^OAUTH_CLIENT_SECRET=.*/OAUTH_CLIENT_SECRET=$(openssl rand -hex 24)/" .env.example > .env
      - run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
      - name: Esperar a que todo responda
        run: timeout 180 bash -c 'until curl -fs http://127.0.0.1:3070/api/health; do sleep 3; done'
      - name: Migrar la base y sembrar las cuentas de prueba
        run: |
          docker compose exec -T api npx prisma migrate deploy
          docker compose exec -T api npx prisma db seed
      - run: ./scripts/smoke.sh
      - name: El worker solo puede lo que debe (Postgres y Redis)
        run: ./scripts/permisos-worker.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Pruebas de seguridad contra el sistema vivo (API)
        working-directory: api
        run: npm ci --no-fund && npm run test:e2e
      - name: Recorrido completo en Chrome real
        working-directory: web
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
        run: npm ci --no-fund && npm run test:browser
      # Si algo falla, primero el ESTADO de cada contenedor: ¿sigue vivo?, ¿con qué código salió?, ¿lo mató la falta de
      # memoria?, ¿cuántas veces se reinició? Lo agregó v0.12: el smoke falló con la API muda y en ninguna máquina local
      # se pudo reproducir; sin esto, el registro no dice si la API se cayó, se reinició o se quedó sin memoria.
      - name: Estado de los contenedores (solo si algo falló)
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a
          for c in $(docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -aq); do
            docker inspect -f '{{.Name}} estado={{.State.Status}} salida={{.State.ExitCode}} sin_memoria={{.State.OOMKilled}} reinicios={{.RestartCount}} empezó={{.State.StartedAt}} terminó={{.State.FinishedAt}} error={{.State.Error}}' "$c"
          done
          free -m
      - name: Registro completo de la API (solo si algo falló)
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --timestamps api
      - if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail 100
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
