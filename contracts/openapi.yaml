# Contrato de la API de Atalaya. Se escribe ANTES que el código y manda sobre él:
# - el frontend genera sus tipos de aquí (web: npm run contract:types);
# - el gemelo en Django (después de v1.0) tendrá que cumplir exactamente este archivo.
openapi: 3.1.0
info:
  title: Atalaya API
  version: 0.10.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
# Por defecto TODA ruta exige sesión (cookie de acceso). Las públicas lo dicen con `security: []`.
security:
  - accessCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado de la base, Redis y el worker
      description: Público. Solo devuelve estados; nunca mensajes de error, hosts ni versiones.
      security: []
      responses:
        "200":
          description: Todo responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Al menos una pieza no responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "429":
          description: Se superó el tope de peticiones
  /auth/register:
    post:
      operationId: register
      summary: Pide crear una cuenta (manda un enlace de verificación)
      description: |
        Misma respuesta exista o no la cuenta. La cuenta NO se crea aquí: nace al abrir el enlace.
        Tope: 5 por IP cada 15 min.
      security: []
      requestBody: { $ref: "#/components/requestBodies/Register" }
      responses:
        "202": { $ref: "#/components/responses/CheckYourEmail" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Abre el enlace de registro y crea la cuenta (un solo uso)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      summary: Inicia sesión; pone las cookies de acceso y de refresh
      description: Mismo 401 para cuenta inexistente, contraseña mala, cuenta desactivada o bloqueada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: |
            Sesión iniciada (`user`, con cookies) o, si la cuenta tiene 2FA, un reto de un solo uso
            (`twoFactorRequired` + `challenge`) y NINGUNA cookie: la sesión nace en `/auth/2fa/verify`.
          headers:
            Set-Cookie: { description: "Solo sin 2FA: __Host-atalaya_access y __Secure-atalaya_refresh (httpOnly, Secure, SameSite=Strict)", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      operationId: refresh
      summary: Cambia el refresh (de un solo uso) por un par nuevo de cookies
      description: Reusar un refresh ya rotado se toma como robo y cierra todas las sesiones de la cuenta.
      security: []
      responses:
        "204": { description: Cookies renovadas }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: Cierra la sesión (el acceso deja de servir al instante)
      security: []
      responses:
        "204": { description: Sesión cerrada y cookies borradas }
  /auth/me:
    get:
      operationId: me
      summary: Quién soy (exige sesión)
      responses:
        "200":
          description: El usuario de la sesión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicUser" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Pide un enlace para restablecer la contraseña
      description: Misma respuesta exista o no la cuenta. Tope 3 por IP cada 15 min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { $ref: "#/components/responses/CheckYourEmail" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Usa el enlace y fija una contraseña nueva; cierra todas las sesiones
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/2fa:
    get:
      operationId: twoFactorStatus
      summary: Si tienes 2FA activo y cuántos códigos de recuperación te quedan
      responses:
        "200":
          description: Estado del 2FA de quien pregunta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/2fa/setup:
    post:
      operationId: twoFactorSetup
      summary: Empieza a activar el 2FA (pide la contraseña); devuelve el secreto y el QR
      description: |
        Re-autentica con la contraseña: una sesión robada no puede enlazar el autenticador del atacante.
        409 también si la cuenta entra solo con Google y todavía no tiene contraseña.
        El 2FA no queda activo hasta confirmarlo con un código en `/auth/2fa/enable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: Secreto nuevo (pendiente de confirmar)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/enable:
    post:
      operationId: twoFactorEnable
      summary: Confirma el 2FA con un código; devuelve los códigos de recuperación (una sola vez)
      description: Cierra todas las demás sesiones de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/disable:
    post:
      operationId: twoFactorDisable
      summary: Desactiva el 2FA (pide contraseña Y un código)
      description: Cierra todas las demás sesiones de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordAndCodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/recovery-codes:
    post:
      operationId: twoFactorNewRecoveryCodes
      summary: Genera 10 códigos de recuperación nuevos (los anteriores dejan de servir)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordAndCodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/verify:
    post:
      operationId: twoFactorVerify
      summary: "Segundo paso del login: el reto y un código (de la app o de recuperación)"
      description: |
        Reto de un solo uso (5 minutos, máximo 5 intentos). Un código TOTP ya usado se rechaza
        aunque siga dentro de su ventana. Tope: 10 por IP por minuto y 10 fallos por cuenta cada 15 min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorVerifyRequest" }
      responses:
        "200":
          description: Sesión iniciada; pone las cookies de acceso y de refresh
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginSuccess" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/providers:
    get:
      operationId: authProviders
      summary: Qué formas de entrar con una cuenta externa están configuradas
      description: Público. La pantalla de entrada lo consulta para saber si muestra «Continuar con Google».
      security: []
      responses:
        "200":
          description: Proveedores disponibles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
  /auth/google/start:
    get:
      operationId: googleStart
      summary: Empieza el login con Google (redirige al proveedor)
      description: |
        Authorization Code + PKCE (S256) + `state` + `nonce`. Guarda el estado del intento en Redis (10 min)
        y lo ata al navegador con la cookie `__Host-atalaya_oauth` (httpOnly, Secure, SameSite=Lax: Lax y no Strict
        porque el regreso desde Google es una navegación entre sitios). 404 si el proveedor no está configurado.
      security: []
      responses:
        "302":
          description: Redirige a la pantalla de autorización del proveedor
          headers:
            Location: { description: "URL de autorización con response_type, client_id, redirect_uri, scope, state, nonce y code_challenge", schema: { type: string } }
            Set-Cookie: { description: "__Host-atalaya_oauth", schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: "Regreso desde Google: canjea el código, valida el id_token y abre sesión"
      description: |
        Nunca devuelve JSON ni detalles: siempre redirige. Éxito sin 2FA: `/cuenta` con las cookies de sesión.
        Éxito con 2FA: `/login#challenge=…` (el reto va en el fragmento, que no viaja al servidor ni en Referer).
        Cualquier fallo (state, cookie, PKCE, firma, emisor, audiencia, nonce, caducidad, correo no verificado,
        cuenta desactivada…): `/login?error=google`, sin decir cuál.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "302":
          description: Redirige a `/cuenta`, a `/login#challenge=…` o a `/login?error=google`
          headers:
            Location: { schema: { type: string } }
  /auth/accept-invite:
    post:
      operationId: acceptInvite
      summary: Usa el enlace de invitación, elige contraseña y activa la cuenta (un solo uso)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/roles:
    get:
      operationId: adminRoles
      summary: Roles que quien pregunta puede asignar (los de nivel menor al suyo)
      description: Exige nivel admin (3) o más; si no, 403.
      responses:
        "200":
          description: Roles asignables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssignableRole" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      operationId: adminListUsers
      summary: Cuentas de nivel menor al de quien pregunta (20 por página)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Parte del correo }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de cuentas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateUser
      summary: Crea una cuenta sin contraseña y le manda una invitación
      description: El rol debe ser de nivel menor al de quien crea. Director y super, máximo uno activo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: adminGetUser
      summary: Una cuenta (404 si no existe O si está a tu nivel o arriba)
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: adminChangeRole
      summary: Cambia el rol; el actual y el nuevo deben estar por debajo de quien cambia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: adminDisableUser
      summary: Desactiva la cuenta y cierra todas sus sesiones al instante
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: adminEnableUser
      summary: Reactiva la cuenta (sus sesiones viejas no reviven)
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/security/events:
    get:
      operationId: adminSecurityEvents
      summary: Bitácora de seguridad (lo más reciente primero, 20 por página)
      description: >
        Exige nivel admin (3). Del origen solo se muestra un prefijo del hash de la IP (para ver que
        dos eventos vienen del mismo lugar sin revelarla). El correo de una cuenta solo aparece si
        está por debajo de quien consulta (o es la suya); si no, `user` es null (OWASP API1).
      parameters:
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/SecurityEventType" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityEventPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/security/summary:
    get:
      operationId: adminSecuritySummary
      summary: Eventos por día de los últimos 14 días (alimenta el radar del panel)
      responses:
        "200":
          description: Un renglón por día, también los días sin eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/audit:
    get:
      operationId: adminAudit
      summary: Registro de auditoría (quién hizo qué sobre qué cuenta; 20 por página)
      description: Mismas reglas de visibilidad de correos que la bitácora.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de entradas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /csp-report:
    post:
      operationId: cspReport
      summary: Recolector de reportes de la política de contenido (CSP)
      description: >
        Público a propósito (lo llama el navegador, sin sesión). Responde 204 sea o no un reporte válido
        (no se le dice nada a quien lo manda); solo un cuerpo que no es JSON de objeto o arreglo da 400, y uno de más
        de 16 KB, 413. Topado por IP, con un reporte repetido por
        minuto descartado, y se guarda solo la directiva y el HOST bloqueado (nunca rutas ni parámetros).
      security: []
      requestBody:
        required: true
        content:
          application/csp-report:
            schema: { type: object }
          application/reports+json:
            schema: { type: array, items: { type: object } }
      responses:
        "204": { description: Recibido }
  /uploads:
    get:
      operationId: listUploads
      summary: Mis archivos subidos (20 por página, los más nuevos primero)
      description: Solo los de quien pregunta. Nunca devuelve contenido, solo metadatos y estado.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de archivos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createUpload
      summary: Sube un archivo (CSV o XLSX) y lo encola para su revisión
      description: >
        multipart/form-data con UN solo campo `file`. Revisión en dos tiempos. **En la API, antes de guardar nada:**
        tamaño máximo 5 MB (413), tipo por la FIRMA de los primeros bytes y no por la extensión ni el Content-Type
        (415 si no es CSV ni XLSX, o si la firma no coincide con la extensión), nombre de archivo ignorado como ruta
        (se guarda con un nombre generado), y máximo 10 archivos por cuenta (409). Los `.xlsm`, `.xlsb`, `.xls` y
        cualquier otro formato con macros se rechazan con 415. **En el worker, ya encolado:** bomba zip (tamaño
        descomprimido y razón de compresión), demasiadas entradas, rango de hoja gigante, XML mal formado. Responde
        202: el resultado de la revisión profunda se consulta con `getUpload`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadRequest" }
      responses:
        "202":
          description: Aceptado y en cola (`status` = queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429":
          description: Se superó el tope de peticiones
  /uploads/{id}:
    parameters:
      - $ref: "#/components/parameters/UploadId"
    get:
      operationId: getUpload
      summary: Estado de un archivo mío
      description: 404 si no existe O si es de otra cuenta (nunca 403, para no confirmar que existe), también para un admin.
      responses:
        "200":
          description: El archivo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteUpload
      summary: Borra un archivo mío (el original y sus resultados)
      description: Mismo 404 que `getUpload`. Si el worker lo está revisando, se marca y el worker descarta el resultado.
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/uploads:
    get:
      operationId: adminListUploads
      summary: Metadatos de los archivos de las cuentas de nivel menor al tuyo (20 por página)
      description: >
        Exige nivel admin (3) o más. Solo dueño, tamaño, tipo, estado y fecha: el admin administra cuentas, NO lee
        datos (nunca hay ruta para el contenido ni para el nombre original). Misma regla de visibilidad que
        `adminListUsers`.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de metadatos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUploadPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /analyses:
    get:
      operationId: listAnalyses
      summary: Mis análisis (20 por página, los más nuevos primero)
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de análisis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      operationId: createAnalysis
      summary: Empieza el análisis de un archivo mío ya aceptado
      description: >
        Paso 1 de 2: el worker lee el archivo y devuelve una VISTA PREVIA (columnas, ejemplos y un mapeo sugerido);
        el análisis queda en `awaiting_mapping` hasta que la persona confirme las columnas con `putAnalysisMapping`.
        404 si el archivo no existe O es de otra cuenta; 409 si el archivo no está `accepted` o si ya hay
        10 análisis en la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAnalysisRequest" }
      responses:
        "202":
          description: Aceptado; el worker prepara la vista previa (`status` = previewing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429":
          description: Se superó el tope de peticiones
  /analyses/{id}:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    get:
      operationId: getAnalysis
      summary: Un análisis mío (estado, vista previa, mapeo e informe de calidad)
      description: 404 si no existe O es de otra cuenta (también para un admin).
      responses:
        "200":
          description: El análisis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteAnalysis
      summary: Borra un análisis mío y sus resultados (el archivo subido no se toca)
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /analyses/{id}/mapping:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
    put:
      operationId: putAnalysisMapping
      summary: Confirma qué columna es cada campo y lanza la limpieza
      description: >
        Paso 2 de 2. Solo con el análisis en `awaiting_mapping` (409 si no). `date` y `amount` son obligatorios;
        dos campos no pueden apuntar a la misma columna (400); un índice fuera de la vista previa, tampoco (400).
        Responde 202: el worker limpia el archivo y deja el informe de calidad en `getAnalysis`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Mapping" }
      responses:
        "202":
          description: Aceptado; en cola (`status` = queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Analysis" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /analyses/{id}/export/{kind}:
    parameters:
      - $ref: "#/components/parameters/AnalysisId"
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [clean, report] }
        description: "`clean` = los datos ya limpios; `report` = el informe de calidad."
    get:
      operationId: exportAnalysis
      summary: Descarga un resultado como CSV
      description: >
        Solo con el análisis en `done` (409 si no). **Anti inyección de fórmulas:** toda celda de TEXTO que empiece con
        `=`, `+`, `-`, `@`, tabulador o retorno de carro sale precedida de una comilla simple (`'`), para que Excel o
        Calc la lean como texto y no como fórmula. Las columnas numéricas y de fecha salen tipadas, sin tocar.
        Se entrega como adjunto, con tipo `text/csv` y UTF-8 con BOM (Excel en español lo abre bien).
      responses:
        "200":
          description: El CSV
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /profit:
    get:
      operationId: getProfit
      summary: Resultado por mes (ventas menos gastos) de dos análisis míos
      description: >
        Combina un análisis de VENTAS y uno de GASTOS, ambos terminados, mes por mes. Los importes se restan en la API
        con aritmética entera de centavos (nunca con números de punto flotante). Un mes que solo está en una de las
        dos series cuenta como 0.00 en la otra. 404 si cualquiera de los dos no existe O es de otra cuenta; 409 si
        alguno no está terminado; 400 si `sales` no es un análisis de ventas o `expenses` no es uno de gastos.
      parameters:
        - { name: sales, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: expenses, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: El resultado mensual y sus totales
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profit" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
components:
  parameters:
    AnalysisId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-atalaya_access
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegisterRequest" }
    Token:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenRequest" }
  responses:
    RecoveryCodes:
      description: Los códigos nuevos. Se muestran UNA vez; la base solo guarda su hash.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecoveryCodes" }
    AdminUser:
      description: La cuenta, como la ve el admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    CheckYourEmail:
      description: Aceptado. El resultado real se le cuenta al dueño del correo, por correo.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Message:
      description: Hecho
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Error:
      description: Error (validación, sin sesión, tope superado…)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Se normaliza a minúsculas y sin espacios.
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      description: No puede contener la parte local del correo.
    OpaqueToken:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 128 }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/OpaqueToken" }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { $ref: "#/components/schemas/OpaqueToken" }
        password: { $ref: "#/components/schemas/NewPassword" }
    Role:
      type: object
      additionalProperties: false
      required: [name, level]
      properties:
        name: { type: string, enum: [usuario, staff, manager, admin, director, super] }
        level: { type: integer, minimum: 0, maximum: 5 }
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
    LoginSuccess:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
    TwoFactorChallenge:
      type: object
      additionalProperties: false
      required: [twoFactorRequired, challenge]
      properties:
        twoFactorRequired: { type: boolean, enum: [true] }
        challenge: { $ref: "#/components/schemas/OpaqueToken" }
    LoginResponse:
      oneOf:
        - { $ref: "#/components/schemas/LoginSuccess" }
        - { $ref: "#/components/schemas/TwoFactorChallenge" }
    TwoFactorCode:
      type: string
      minLength: 6
      maxLength: 32
      description: 6 dígitos de la app, o un código de recuperación (XXXX-XXXX-XXXX-XXXX).
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TwoFactorCode" }
    PasswordAndCodeRequest:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        code: { $ref: "#/components/schemas/TwoFactorCode" }
    TwoFactorVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge: { $ref: "#/components/schemas/OpaqueToken" }
        code: { $ref: "#/components/schemas/TwoFactorCode" }
    TwoFactorStatus:
      type: object
      additionalProperties: false
      required: [enabled, recoveryCodesLeft]
      properties:
        enabled: { type: boolean }
        recoveryCodesLeft: { type: integer, minimum: 0, maximum: 10 }
    TwoFactorSetup:
      type: object
      additionalProperties: false
      required: [secret, otpauthUrl, qrSvg]
      properties:
        secret: { type: string, description: "Base32, para escribirlo a mano en la app" }
        otpauthUrl: { type: string }
        qrSvg: { type: string, description: "El QR como SVG (se muestra dentro de un <img>, nunca como HTML)" }
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    RoleName:
      type: string
      enum: [usuario, staff, manager, admin, director, super]
    AssignableRole:
      type: object
      additionalProperties: false
      required: [name, level, maxCount]
      properties:
        name: { $ref: "#/components/schemas/RoleName" }
        level: { type: integer, minimum: 0, maximum: 5 }
        maxCount: { type: [integer, "null"], description: "Cuentas activas permitidas (null = sin límite)" }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, roleName]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        roleName: { $ref: "#/components/schemas/RoleName" }
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [roleName]
      properties:
        roleName: { $ref: "#/components/schemas/RoleName" }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, invited, disabled] }
        createdAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SecurityEventType:
      type: string
      enum: [login_failed, login_locked, two_factor_failed, refresh_reuse, google_rejected, rate_limited, csp_violation]
    AccountRef:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
    SecurityEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, source, detail, user]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/SecurityEventType" }
        createdAt: { type: string, format: date-time }
        source: { type: [string, "null"], description: "Primeros 8 caracteres del hash de la IP" }
        detail: { type: [string, "null"], description: Un código corto (p. ej. bad_password), nunca datos de la persona }
        user:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - { type: "null" }
    SecurityEventPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SecuritySummary:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, total, byType]
            properties:
              date: { type: string, format: date }
              total: { type: integer }
              byType: { type: object, additionalProperties: { type: integer } }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, createdAt, detail, actor, target]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        createdAt: { type: string, format: date-time }
        detail: { type: [string, "null"] }
        actor:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - { type: "null" }
        target:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - { type: "null" }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Providers:
      type: object
      additionalProperties: false
      required: [google]
      properties:
        google: { type: boolean }
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        error: { type: string }
    CheckState:
      type: string
      enum: [ok, down]
    HealthReport:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties: false
          required: [database, redis, worker]
          properties:
            database: { $ref: "#/components/schemas/CheckState" }
            redis: { $ref: "#/components/schemas/CheckState" }
            worker: { $ref: "#/components/schemas/CheckState" }
    UploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: { type: string, format: binary, description: "CSV o XLSX, máximo 5 MB" }
    UploadStatus:
      type: string
      enum: [queued, checking, accepted, rejected]
      description: >
        queued = en la cola · checking = el worker lo revisa · accepted = pasó la revisión profunda ·
        rejected = no pasó (ver `rejectReason`).
    UploadRejectReason:
      type: string
      enum: [zip_bomb, too_many_entries, range_too_large, corrupt, empty, worker_timeout]
      description: >
        Lista CERRADA; nunca texto libre del archivo ni del error interno. Los rechazos de la API (tamaño, firma,
        macros) no llegan aquí: se responden 413/415 y no se guarda nada.
    Upload:
      type: object
      additionalProperties: false
      required: [id, kind, sizeBytes, status, rejectReason, createdAt, checkedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [csv, xlsx] }
        displayName: { type: string, maxLength: 100, description: "Nombre original saneado, solo para mostrárselo a su dueño. Se omite si no hay." }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        status: { $ref: "#/components/schemas/UploadStatus" }
        rejectReason:
          oneOf:
            - { $ref: "#/components/schemas/UploadRejectReason" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        checkedAt: { type: [string, "null"], format: date-time }
    UploadPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Upload" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AdminUpload:
      type: object
      additionalProperties: false
      required: [id, ownerEmail, kind, sizeBytes, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        ownerEmail: { $ref: "#/components/schemas/Email" }
        kind: { type: string, enum: [csv, xlsx] }
        sizeBytes: { type: integer }
        status: { $ref: "#/components/schemas/UploadStatus" }
        createdAt: { type: string, format: date-time }
    AdminUploadPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUpload" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    CreateAnalysisRequest:
      type: object
      additionalProperties: false
      required: [uploadId]
      properties:
        uploadId: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/AnalysisKind"
    AnalysisKind:
      type: string
      enum: [sales, expenses]
      default: sales
      description: >
        Qué contiene el archivo: ventas (ingresos) o gastos. Se elige al crear y no cambia. La limpieza es la misma;
        cambia lo que significa el informe, y solo un análisis de ventas y uno de gastos pueden combinarse en `getProfit`.
    AnalysisStatus:
      type: string
      enum: [previewing, awaiting_mapping, queued, running, done, failed]
      description: >
        previewing = el worker lee el archivo · awaiting_mapping = espera que confirmes las columnas ·
        queued/running = limpiando · done = hay informe y descargas · failed = ver `failReason`.
    AnalysisFailReason:
      type: string
      enum: [unreadable, no_header, too_few_columns, mapping_invalid, nothing_left, worker_timeout]
      description: >
        Lista CERRADA; nunca texto del archivo ni del error interno. nothing_left = tras la limpieza no sobró
        ninguna fila válida.
    ColumnIndex:
      type: integer
      minimum: 0
      maximum: 199
      description: Posición de la columna en el archivo (la primera es 0). El archivo tiene máximo 200 columnas.
    Mapping:
      type: object
      additionalProperties: false
      required: [date, amount]
      properties:
        date: { $ref: "#/components/schemas/ColumnIndex" }
        amount: { $ref: "#/components/schemas/ColumnIndex" }
        quantity: { $ref: "#/components/schemas/ColumnIndex" }
        product: { $ref: "#/components/schemas/ColumnIndex" }
        branch: { $ref: "#/components/schemas/ColumnIndex" }
        orderId: { $ref: "#/components/schemas/ColumnIndex" }
        dateOrder:
          type: string
          enum: [auto, dmy, mdy, ymd]
          default: auto
          description: >
            Orden de las fechas con diagonales (`03/04/2026`). `auto` decide por los datos; si todas las fechas
            son ambiguas, usa día/mes/año (México) y lo avisa en el informe (`ambiguous_dates`).
        decimalSeparator:
          type: string
          enum: [auto, ".", ","]
          default: auto
          description: Separador decimal de los importes (`1,234.50` o `1.234,50`).
    PreviewColumn:
      type: object
      additionalProperties: false
      required: [index, name, samples]
      properties:
        index: { $ref: "#/components/schemas/ColumnIndex" }
        name: { type: string, maxLength: 60, description: "Encabezado del archivo, recortado y sin caracteres de control." }
        samples:
          type: array
          maxItems: 5
          items: { type: string, maxLength: 40 }
          description: "Hasta 5 valores de ejemplo, recortados. Es DATO del archivo: se muestra como texto, nunca como HTML."
    AnalysisPreview:
      type: object
      additionalProperties: false
      required: [columns, rowCount, suggested]
      properties:
        columns: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/PreviewColumn" } }
        rowCount: { type: integer, minimum: 0, maximum: 50000, description: Filas de datos (sin el encabezado). }
        suggested:
          description: El mapeo que el worker adivina por nombres y contenido. Solo es una sugerencia.
          allOf:
            - { $ref: "#/components/schemas/SuggestedMapping" }
    SuggestedMapping:
      type: object
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/ColumnIndex" }
        amount: { $ref: "#/components/schemas/ColumnIndex" }
        quantity: { $ref: "#/components/schemas/ColumnIndex" }
        product: { $ref: "#/components/schemas/ColumnIndex" }
        branch: { $ref: "#/components/schemas/ColumnIndex" }
        orderId: { $ref: "#/components/schemas/ColumnIndex" }
    IssueCode:
      type: string
      enum:
        - blank_row
        - duplicate_row
        - bad_date
        - future_date
        - bad_amount
        - negative_amount
        - zero_amount
        - bad_quantity
        - ambiguous_dates
        - text_trimmed
        - text_truncated
      description: >
        Lista CERRADA de problemas que la limpieza sabe reconocer. Los primeros cinco y `bad_quantity` TIRAN la fila;
        `negative_amount`, `zero_amount` y `ambiguous_dates` solo AVISAN; `text_trimmed` y `text_truncated` son
        arreglos menores (espacios, y texto de más de 200 caracteres). Nada se descarta sin quedar contado aquí.
    QualityIssue:
      type: object
      additionalProperties: false
      required: [code, count, dropped, examples]
      properties:
        code: { $ref: "#/components/schemas/IssueCode" }
        count: { type: integer, minimum: 1 }
        dropped: { type: boolean, description: "¿Las filas con este problema se descartaron?" }
        examples:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/IssueExample" }
    IssueExample:
      type: object
      additionalProperties: false
      required: [row, value]
      properties:
        row: { type: integer, minimum: 1, description: "Número de fila en el archivo (el encabezado es la 1)." }
        value: { type: string, maxLength: 40, description: "Lo que decía la celda, recortado. Es DATO del archivo: solo texto." }
    ColumnQuality:
      type: object
      additionalProperties: false
      required: [field, filled, invalid]
      properties:
        field: { type: string, enum: [date, amount, quantity, product, branch, orderId] }
        filled: { type: integer, minimum: 0, description: Filas leídas con algo en esta columna. }
        invalid: { type: integer, minimum: 0, description: Filas con algo que no se pudo leer. }
    QualityReport:
      type: object
      additionalProperties: false
      required: [rowsRead, rowsKept, rowsDropped, dateFrom, dateTo, totalAmount, columns, issues]
      properties:
        rowsRead: { type: integer, minimum: 0 }
        rowsKept: { type: integer, minimum: 0 }
        rowsDropped: { type: integer, minimum: 0 }
        dateFrom: { type: [string, "null"], format: date }
        dateTo: { type: [string, "null"], format: date }
        totalAmount:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          description: Suma de los importes que se conservaron, como TEXTO decimal exacto (nunca un número de punto flotante).
        columns: { type: array, items: { $ref: "#/components/schemas/ColumnQuality" } }
        issues: { type: array, items: { $ref: "#/components/schemas/QualityIssue" } }
    Analysis:
      type: object
      additionalProperties: false
      required: [id, uploadId, kind, status, failReason, preview, mapping, report, insights, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        uploadId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AnalysisKind" }
        status: { $ref: "#/components/schemas/AnalysisStatus" }
        failReason:
          oneOf:
            - { $ref: "#/components/schemas/AnalysisFailReason" }
            - { type: "null" }
        preview:
          oneOf:
            - { $ref: "#/components/schemas/AnalysisPreview" }
            - { type: "null" }
        mapping:
          oneOf:
            - { $ref: "#/components/schemas/Mapping" }
            - { type: "null" }
        report:
          oneOf:
            - { $ref: "#/components/schemas/QualityReport" }
            - { type: "null" }
        insights:
          description: Indicadores, Pareto, anomalías y pronóstico. Solo con el análisis terminado (null antes).
          oneOf:
            - { $ref: "#/components/schemas/Insights" }
            - { type: "null" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AnalysisPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Analysis" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Money:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]{2}$"
      description: Importe como TEXTO decimal exacto con dos decimales (nunca un número de punto flotante).
    Percent:
      type: string
      pattern: "^-?[0-9]+\\.[0-9]$"
      description: Porcentaje como TEXTO decimal con un decimal (`12.5` es 12,5 %).
    DayAmount:
      type: object
      additionalProperties: false
      required: [date, amount]
      properties:
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
    Indicators:
      type: object
      additionalProperties: false
      required: [grossAmount, returnsAmount, netAmount, rows, activeDays, averagePerActiveDay, orders, averageTicket, bestDay, worstDay]
      properties:
        grossAmount: { $ref: "#/components/schemas/Money", description: "Suma de los importes positivos." }
        returnsAmount: { $ref: "#/components/schemas/Money", description: "Suma de los importes negativos, en positivo (devoluciones o notas de crédito)." }
        netAmount: { $ref: "#/components/schemas/Money", description: "Bruto menos devoluciones; coincide con `totalAmount` del informe de calidad." }
        rows: { type: integer, minimum: 1 }
        activeDays: { type: integer, minimum: 1, description: "Días distintos con al menos una fila." }
        averagePerActiveDay: { $ref: "#/components/schemas/Money" }
        orders:
          type: [integer, "null"]
          description: Pedidos distintos. null si no se mapeó la columna de pedido o folio.
        averageTicket:
          description: Importe neto promedio por pedido. null si `orders` es null.
          oneOf:
            - { $ref: "#/components/schemas/Money" }
            - { type: "null" }
        bestDay:
          oneOf:
            - { $ref: "#/components/schemas/DayAmount" }
            - { type: "null" }
        worstDay:
          oneOf:
            - { $ref: "#/components/schemas/DayAmount" }
            - { type: "null" }
    MonthPoint:
      type: object
      additionalProperties: false
      required: [month, amount, rows, changePercent]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        amount: { $ref: "#/components/schemas/Money" }
        rows: { type: integer, minimum: 1 }
        changePercent:
          description: Cambio contra el mes anterior CON DATOS. null en el primer mes o si el anterior suma 0.
          oneOf:
            - { $ref: "#/components/schemas/Percent" }
            - { type: "null" }
    WeekdayPoint:
      type: object
      additionalProperties: false
      required: [weekday, average, days]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7, description: "ISO: 1 = lunes … 7 = domingo." }
        average: { $ref: "#/components/schemas/Money", description: "Promedio del total diario de ese día de la semana." }
        days: { type: integer, minimum: 1, description: "Cuántos días de ese tipo con datos entran en el promedio." }
    BranchPoint:
      type: object
      additionalProperties: false
      required: [name, amount, sharePercent]
      properties:
        name: { type: string, maxLength: 200, description: "Texto del archivo (dato hostil): solo se muestra como texto." }
        amount: { $ref: "#/components/schemas/Money" }
        sharePercent: { $ref: "#/components/schemas/Percent" }
    ParetoItem:
      type: object
      additionalProperties: false
      required: [name, amount, sharePercent, cumulativePercent, class]
      properties:
        name: { type: string, maxLength: 200, description: "Texto del archivo (dato hostil): solo se muestra como texto." }
        amount: { $ref: "#/components/schemas/Money" }
        sharePercent: { $ref: "#/components/schemas/Percent" }
        cumulativePercent: { $ref: "#/components/schemas/Percent" }
        class: { type: string, enum: [A, B, C], description: "A = hasta el 80 % acumulado, B = hasta el 95 %, C = el resto." }
    Pareto:
      type: object
      additionalProperties: false
      required: [items, otherCount, otherAmount, nonPositiveCount]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/ParetoItem" } }
        otherCount: { type: integer, minimum: 0, description: "Elementos con importe positivo que no caben en `items` (los 20 mayores)." }
        otherAmount: { $ref: "#/components/schemas/Money" }
        nonPositiveCount: { type: integer, minimum: 0, description: "Elementos con total neto cero o negativo: no entran en el Pareto." }
    Anomaly:
      type: object
      additionalProperties: false
      required: [date, amount, expected, direction, score]
      properties:
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        expected: { $ref: "#/components/schemas/Money", description: "Lo normal para ese día de la semana (la mediana)." }
        direction: { type: string, enum: [high, low] }
        score: { type: string, pattern: "^[0-9]+\\.[0-9]$", description: "Puntaje robusto (MAD) en valor absoluto; se marca desde 3.5." }
    Anomalies:
      type: object
      additionalProperties: false
      required: [status, items]
      properties:
        status: { type: string, enum: [ok, insufficient_data], description: "Hacen falta al menos 28 días activos." }
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/Anomaly" } }
    ForecastPoint:
      type: object
      additionalProperties: false
      required: [date, expected, lower, upper]
      properties:
        date: { type: string, format: date }
        expected: { $ref: "#/components/schemas/Money" }
        lower: { $ref: "#/components/schemas/Money" }
        upper: { $ref: "#/components/schemas/Money" }
    Forecast:
      type: object
      additionalProperties: false
      required: [status, method, horizonDays, points, backtest]
      properties:
        status: { type: string, enum: [ok, insufficient_data], description: "Hacen falta al menos 8 semanas de historia." }
        method: { type: string, enum: [weekday_average], description: "Promedio de las últimas 8 veces que cayó ese día de la semana. Un punto de partida honesto, NO un modelo predictivo." }
        horizonDays: { type: integer, enum: [14] }
        points: { type: array, maxItems: 14, items: { $ref: "#/components/schemas/ForecastPoint" } }
        backtest:
          description: Cómo le habría ido el mismo método a los últimos 14 días (sin verlos). Es la medida de cuánto fiarse.
          oneOf:
            - type: object
              additionalProperties: false
              required: [days, wape]
              properties:
                days: { type: integer, enum: [14] }
                wape: { description: "Error absoluto ponderado: suma de |real − pronóstico| entre la suma de lo real. null si lo real suma 0.", oneOf: [{ $ref: "#/components/schemas/Percent" }, { type: "null" }] }
            - { type: "null" }
    Insights:
      type: object
      additionalProperties: false
      required: [timezone, asOf, indicators, monthly, weekdays, branches, pareto, anomalies, forecast]
      properties:
        timezone: { type: string, enum: [America/Mexico_City], description: "Zona horaria del negocio: de ella sale «hoy» (fechas futuras y arranque del pronóstico)." }
        asOf: { type: string, format: date, description: "La fecha de «hoy» en esa zona al calcular." }
        indicators: { $ref: "#/components/schemas/Indicators" }
        monthly: { type: array, items: { $ref: "#/components/schemas/MonthPoint" } }
        weekdays: { type: array, maxItems: 7, items: { $ref: "#/components/schemas/WeekdayPoint" } }
        branches:
          description: Las 10 mayores sucursales por importe neto positivo. null si no se mapeó la columna de sucursal.
          oneOf:
            - { type: array, maxItems: 10, items: { $ref: "#/components/schemas/BranchPoint" } }
            - { type: "null" }
        pareto:
          description: Qué pocos elementos concentran el importe. null si no se mapeó la columna de producto.
          oneOf:
            - { $ref: "#/components/schemas/Pareto" }
            - { type: "null" }
        anomalies: { $ref: "#/components/schemas/Anomalies" }
        forecast: { $ref: "#/components/schemas/Forecast" }
    ProfitMonth:
      type: object
      additionalProperties: false
      required: [month, sales, expenses, result]
      properties:
        month: { type: string, pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$" }
        sales: { $ref: "#/components/schemas/Money" }
        expenses: { $ref: "#/components/schemas/Money" }
        result: { $ref: "#/components/schemas/Money", description: "Ventas menos gastos; puede ser negativo." }
    Profit:
      type: object
      additionalProperties: false
      required: [months, salesTotal, expensesTotal, resultTotal]
      properties:
        months: { type: array, items: { $ref: "#/components/schemas/ProfitMonth" } }
        salesTotal: { $ref: "#/components/schemas/Money" }
        expensesTotal: { $ref: "#/components/schemas/Money" }
        resultTotal: { $ref: "#/components/schemas/Money" }
