# Contrato de la API de Atalaya. Se escribe ANTES que el código y manda sobre él:
# - el frontend genera sus tipos de aquí (web: npm run contract:types);
# - el gemelo en Django (después de v1.0) tendrá que cumplir exactamente este archivo.
openapi: 3.1.0
info:
  title: Atalaya API
  version: 0.7.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api
# Por defecto TODA ruta exige sesión (cookie de acceso). Las públicas lo dicen con `security: []`.
security:
  - accessCookie: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado de la base, Redis y el worker
      description: Público. Solo devuelve estados; nunca mensajes de error, hosts ni versiones.
      security: []
      responses:
        "200":
          description: Todo responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: Al menos una pieza no responde
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "429":
          description: Se superó el tope de peticiones
  /auth/register:
    post:
      operationId: register
      summary: Pide crear una cuenta (manda un enlace de verificación)
      description: |
        Misma respuesta exista o no la cuenta. La cuenta NO se crea aquí: nace al abrir el enlace.
        Tope: 5 por IP cada 15 min.
      security: []
      requestBody: { $ref: "#/components/requestBodies/Register" }
      responses:
        "202": { $ref: "#/components/responses/CheckYourEmail" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Abre el enlace de registro y crea la cuenta (un solo uso)
      security: []
      requestBody: { $ref: "#/components/requestBodies/Token" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      operationId: login
      summary: Inicia sesión; pone las cookies de acceso y de refresh
      description: Mismo 401 para cuenta inexistente, contraseña mala, cuenta desactivada o bloqueada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: |
            Sesión iniciada (`user`, con cookies) o, si la cuenta tiene 2FA, un reto de un solo uso
            (`twoFactorRequired` + `challenge`) y NINGUNA cookie: la sesión nace en `/auth/2fa/verify`.
          headers:
            Set-Cookie: { description: "Solo sin 2FA: __Host-atalaya_access y __Secure-atalaya_refresh (httpOnly, Secure, SameSite=Strict)", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/refresh:
    post:
      operationId: refresh
      summary: Cambia el refresh (de un solo uso) por un par nuevo de cookies
      description: Reusar un refresh ya rotado se toma como robo y cierra todas las sesiones de la cuenta.
      security: []
      responses:
        "204": { description: Cookies renovadas }
        "401": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      summary: Cierra la sesión (el acceso deja de servir al instante)
      security: []
      responses:
        "204": { description: Sesión cerrada y cookies borradas }
  /auth/me:
    get:
      operationId: me
      summary: Quién soy (exige sesión)
      responses:
        "200":
          description: El usuario de la sesión
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicUser" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Pide un enlace para restablecer la contraseña
      description: Misma respuesta exista o no la cuenta. Tope 3 por IP cada 15 min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { $ref: "#/components/responses/CheckYourEmail" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Usa el enlace y fija una contraseña nueva; cierra todas las sesiones
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/2fa:
    get:
      operationId: twoFactorStatus
      summary: Si tienes 2FA activo y cuántos códigos de recuperación te quedan
      responses:
        "200":
          description: Estado del 2FA de quien pregunta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/2fa/setup:
    post:
      operationId: twoFactorSetup
      summary: Empieza a activar el 2FA (pide la contraseña); devuelve el secreto y el QR
      description: |
        Re-autentica con la contraseña: una sesión robada no puede enlazar el autenticador del atacante.
        409 también si la cuenta entra solo con Google y todavía no tiene contraseña.
        El 2FA no queda activo hasta confirmarlo con un código en `/auth/2fa/enable`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: Secreto nuevo (pendiente de confirmar)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/enable:
    post:
      operationId: twoFactorEnable
      summary: Confirma el 2FA con un código; devuelve los códigos de recuperación (una sola vez)
      description: Cierra todas las demás sesiones de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/disable:
    post:
      operationId: twoFactorDisable
      summary: Desactiva el 2FA (pide contraseña Y un código)
      description: Cierra todas las demás sesiones de la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordAndCodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/recovery-codes:
    post:
      operationId: twoFactorNewRecoveryCodes
      summary: Genera 10 códigos de recuperación nuevos (los anteriores dejan de servir)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordAndCodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/RecoveryCodes" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/2fa/verify:
    post:
      operationId: twoFactorVerify
      summary: "Segundo paso del login: el reto y un código (de la app o de recuperación)"
      description: |
        Reto de un solo uso (5 minutos, máximo 5 intentos). Un código TOTP ya usado se rechaza
        aunque siga dentro de su ventana. Tope: 10 por IP por minuto y 10 fallos por cuenta cada 15 min.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TwoFactorVerifyRequest" }
      responses:
        "200":
          description: Sesión iniciada; pone las cookies de acceso y de refresh
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginSuccess" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/providers:
    get:
      operationId: authProviders
      summary: Qué formas de entrar con una cuenta externa están configuradas
      description: Público. La pantalla de entrada lo consulta para saber si muestra «Continuar con Google».
      security: []
      responses:
        "200":
          description: Proveedores disponibles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Providers" }
  /auth/google/start:
    get:
      operationId: googleStart
      summary: Empieza el login con Google (redirige al proveedor)
      description: |
        Authorization Code + PKCE (S256) + `state` + `nonce`. Guarda el estado del intento en Redis (10 min)
        y lo ata al navegador con la cookie `__Host-atalaya_oauth` (httpOnly, Secure, SameSite=Lax: Lax y no Strict
        porque el regreso desde Google es una navegación entre sitios). 404 si el proveedor no está configurado.
      security: []
      responses:
        "302":
          description: Redirige a la pantalla de autorización del proveedor
          headers:
            Location: { description: "URL de autorización con response_type, client_id, redirect_uri, scope, state, nonce y code_challenge", schema: { type: string } }
            Set-Cookie: { description: "__Host-atalaya_oauth", schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/google/callback:
    get:
      operationId: googleCallback
      summary: "Regreso desde Google: canjea el código, valida el id_token y abre sesión"
      description: |
        Nunca devuelve JSON ni detalles: siempre redirige. Éxito sin 2FA: `/cuenta` con las cookies de sesión.
        Éxito con 2FA: `/login#challenge=…` (el reto va en el fragmento, que no viaja al servidor ni en Referer).
        Cualquier fallo (state, cookie, PKCE, firma, emisor, audiencia, nonce, caducidad, correo no verificado,
        cuenta desactivada…): `/login?error=google`, sin decir cuál.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string, maxLength: 2048 } }
        - { name: state, in: query, required: false, schema: { type: string, maxLength: 128 } }
        - { name: error, in: query, required: false, schema: { type: string, maxLength: 128 } }
      responses:
        "302":
          description: Redirige a `/cuenta`, a `/login#challenge=…` o a `/login?error=google`
          headers:
            Location: { schema: { type: string } }
  /auth/accept-invite:
    post:
      operationId: acceptInvite
      summary: Usa el enlace de invitación, elige contraseña y activa la cuenta (un solo uso)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "400": { $ref: "#/components/responses/Error" }
  /admin/roles:
    get:
      operationId: adminRoles
      summary: Roles que quien pregunta puede asignar (los de nivel menor al suyo)
      description: Exige nivel admin (3) o más; si no, 403.
      responses:
        "200":
          description: Roles asignables
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssignableRole" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/users:
    get:
      operationId: adminListUsers
      summary: Cuentas de nivel menor al de quien pregunta (20 por página)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: Parte del correo }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de cuentas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateUser
      summary: Crea una cuenta sin contraseña y le manda una invitación
      description: El rol debe ser de nivel menor al de quien crea. Director y super, máximo uno activo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: adminGetUser
      summary: Una cuenta (404 si no existe O si está a tu nivel o arriba)
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/role:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: adminChangeRole
      summary: Cambia el rol; el actual y el nuevo deben estar por debajo de quien cambia
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeRoleRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: adminDisableUser
      summary: Desactiva la cuenta y cierra todas sus sesiones al instante
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }
  /admin/users/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: adminEnableUser
      summary: Reactiva la cuenta (sus sesiones viejas no reviven)
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /admin/security/events:
    get:
      operationId: adminSecurityEvents
      summary: Bitácora de seguridad (lo más reciente primero, 20 por página)
      description: >
        Exige nivel admin (3). Del origen solo se muestra un prefijo del hash de la IP (para ver que
        dos eventos vienen del mismo lugar sin revelarla). El correo de una cuenta solo aparece si
        está por debajo de quien consulta (o es la suya); si no, `user` es null (OWASP API1).
      parameters:
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/SecurityEventType" } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityEventPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/security/summary:
    get:
      operationId: adminSecuritySummary
      summary: Eventos por día de los últimos 14 días (alimenta el radar del panel)
      responses:
        "200":
          description: Un renglón por día, también los días sin eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySummary" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /admin/audit:
    get:
      operationId: adminAudit
      summary: Registro de auditoría (quién hizo qué sobre qué cuenta; 20 por página)
      description: Mismas reglas de visibilidad de correos que la bitácora.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 10000 } }
      responses:
        "200":
          description: Una página de entradas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /csp-report:
    post:
      operationId: cspReport
      summary: Recolector de reportes de la política de contenido (CSP)
      description: >
        Público a propósito (lo llama el navegador, sin sesión). Responde 204 sea o no un reporte válido
        (no se le dice nada a quien lo manda); solo un cuerpo que no es JSON de objeto o arreglo da 400, y uno de más
        de 16 KB, 413. Topado por IP, con un reporte repetido por
        minuto descartado, y se guarda solo la directiva y el HOST bloqueado (nunca rutas ni parámetros).
      security: []
      requestBody:
        required: true
        content:
          application/csp-report:
            schema: { type: object }
          application/reports+json:
            schema: { type: array, items: { type: object } }
      responses:
        "204": { description: Recibido }
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-atalaya_access
  requestBodies:
    Register:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegisterRequest" }
    Token:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TokenRequest" }
  responses:
    RecoveryCodes:
      description: Los códigos nuevos. Se muestran UNA vez; la base solo guarda su hash.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RecoveryCodes" }
    AdminUser:
      description: La cuenta, como la ve el admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    CheckYourEmail:
      description: Aceptado. El resultado real se le cuenta al dueño del correo, por correo.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Message:
      description: Hecho
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Error:
      description: Error (validación, sin sesión, tope superado…)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Email:
      type: string
      format: email
      maxLength: 254
      description: Se normaliza a minúsculas y sin espacios.
    NewPassword:
      type: string
      minLength: 12
      maxLength: 128
      description: No puede contener la parte local del correo.
    OpaqueToken:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/NewPassword" }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 128 }
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { $ref: "#/components/schemas/OpaqueToken" }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { $ref: "#/components/schemas/OpaqueToken" }
        password: { $ref: "#/components/schemas/NewPassword" }
    Role:
      type: object
      additionalProperties: false
      required: [name, level]
      properties:
        name: { type: string, enum: [usuario, staff, manager, admin, director, super] }
        level: { type: integer, minimum: 0, maximum: 5 }
    PublicUser:
      type: object
      additionalProperties: false
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
    LoginSuccess:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
    TwoFactorChallenge:
      type: object
      additionalProperties: false
      required: [twoFactorRequired, challenge]
      properties:
        twoFactorRequired: { type: boolean, enum: [true] }
        challenge: { $ref: "#/components/schemas/OpaqueToken" }
    LoginResponse:
      oneOf:
        - { $ref: "#/components/schemas/LoginSuccess" }
        - { $ref: "#/components/schemas/TwoFactorChallenge" }
    TwoFactorCode:
      type: string
      minLength: 6
      maxLength: 32
      description: 6 dígitos de la app, o un código de recuperación (XXXX-XXXX-XXXX-XXXX).
    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/TwoFactorCode" }
    PasswordAndCodeRequest:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password: { type: string, minLength: 1, maxLength: 128 }
        code: { $ref: "#/components/schemas/TwoFactorCode" }
    TwoFactorVerifyRequest:
      type: object
      additionalProperties: false
      required: [challenge, code]
      properties:
        challenge: { $ref: "#/components/schemas/OpaqueToken" }
        code: { $ref: "#/components/schemas/TwoFactorCode" }
    TwoFactorStatus:
      type: object
      additionalProperties: false
      required: [enabled, recoveryCodesLeft]
      properties:
        enabled: { type: boolean }
        recoveryCodesLeft: { type: integer, minimum: 0, maximum: 10 }
    TwoFactorSetup:
      type: object
      additionalProperties: false
      required: [secret, otpauthUrl, qrSvg]
      properties:
        secret: { type: string, description: "Base32, para escribirlo a mano en la app" }
        otpauthUrl: { type: string }
        qrSvg: { type: string, description: "El QR como SVG (se muestra dentro de un <img>, nunca como HTML)" }
    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items: { type: string }
    RoleName:
      type: string
      enum: [usuario, staff, manager, admin, director, super]
    AssignableRole:
      type: object
      additionalProperties: false
      required: [name, level, maxCount]
      properties:
        name: { $ref: "#/components/schemas/RoleName" }
        level: { type: integer, minimum: 0, maximum: 5 }
        maxCount: { type: [integer, "null"], description: "Cuentas activas permitidas (null = sin límite)" }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, roleName]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        roleName: { $ref: "#/components/schemas/RoleName" }
    ChangeRoleRequest:
      type: object
      additionalProperties: false
      required: [roleName]
      properties:
        roleName: { $ref: "#/components/schemas/RoleName" }
    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, role, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [active, invited, disabled] }
        createdAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SecurityEventType:
      type: string
      enum: [login_failed, login_locked, two_factor_failed, refresh_reuse, google_rejected, rate_limited, csp_violation]
    AccountRef:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string }
    SecurityEvent:
      type: object
      additionalProperties: false
      required: [id, type, createdAt, source, detail, user]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/SecurityEventType" }
        createdAt: { type: string, format: date-time }
        source: { type: [string, "null"], description: "Primeros 8 caracteres del hash de la IP" }
        detail: { type: [string, "null"], description: Un código corto (p. ej. bad_password), nunca datos de la persona }
        user:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - { type: "null" }
    SecurityEventPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    SecuritySummary:
      type: object
      additionalProperties: false
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, total, byType]
            properties:
              date: { type: string, format: date }
              total: { type: integer }
              byType: { type: object, additionalProperties: { type: integer } }
    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, action, createdAt, detail, actor, target]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        createdAt: { type: string, format: date-time }
        detail: { type: [string, "null"] }
        actor:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - { type: "null" }
        target:
          oneOf:
            - $ref: "#/components/schemas/AccountRef"
            - { type: "null" }
    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Providers:
      type: object
      additionalProperties: false
      required: [google]
      properties:
        google: { type: boolean }
    Message:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }
    Error:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        error: { type: string }
    CheckState:
      type: string
      enum: [ok, down]
    HealthReport:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties: false
          required: [database, redis, worker]
          properties:
            database: { $ref: "#/components/schemas/CheckState" }
            redis: { $ref: "#/components/schemas/CheckState" }
            worker: { $ref: "#/components/schemas/CheckState" }
